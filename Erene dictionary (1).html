:root{--bg:#120f26;--bg2:#1b1738;--ink:#ebe6f6;--mute:#a79fc4;--gold:#dcb65e;--ember:#f08a5d;--line:#3a3366;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6efe2;--bg2:#ece2cf;--ink:#231c3d;--mute:#5d5478;--gold:#8a6414;--ember:#b3441c;--line:#cdbf9f;color-scheme:light}}
:root[data-theme="dark"]{--bg:#120f26;--bg2:#1b1738;--ink:#ebe6f6;--mute:#a79fc4;--gold:#dcb65e;--ember:#f08a5d;--line:#3a3366;color-scheme:dark}
:root[data-theme="light"]{--bg:#f6efe2;--bg2:#ece2cf;--ink:#231c3d;--mute:#5d5478;--gold:#8a6414;--ember:#b3441c;--line:#cdbf9f;color-scheme:light}
html{scroll-padding-top:150px;scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Spectral,Georgia,serif}
h1,h2,h3{font-family:Marcellus,Georgia,serif;font-weight:400;margin:0;line-height:1.15}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
header.top{padding:34px 0 18px}
header.top h1{font-size:clamp(2.2rem,7vw,3.4rem);color:var(--gold)}
header.top p{color:var(--mute);margin:.4em 0 0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0}
input[type=search]{width:100%;padding:12px 14px;font:inherit;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:2px}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.chip{padding:5px 12px;border:1px solid var(--line);background:none;color:var(--mute);font:inherit;font-size:.9rem;cursor:pointer;border-radius:2px}
.chip[aria-pressed=true]{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.az{display:flex;flex-wrap:wrap;gap:2px;margin-top:10px}
.az a{padding:2px 7px;text-decoration:none;color:var(--mute);font-size:.9rem}.az a:hover{color:var(--gold)}
.count{color:var(--mute);font-size:.9rem;margin-left:auto}
h2.sec{font-size:1.9rem;margin:46px 0 10px;color:var(--gold)}
h3.let{font-size:1.5rem;color:var(--ember);margin:26px 0 4px;border-bottom:1px solid var(--line);padding-bottom:4px}
.e{display:grid;grid-template-columns:minmax(120px,32%) 1fr;gap:4px 18px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.e .hw b{font-family:Marcellus,serif;font-size:1.2rem;color:var(--gold);font-weight:400;display:block}
.e .hw small{color:var(--mute);font-size:.8rem}
.er{font-family:Erene,serif;font-size:14px;line-height:1.9;color:var(--ink);overflow-wrap:anywhere;display:block}
.noscript .er{display:none}
.m{overflow-wrap:anywhere}
.s{padding:12px 0;border-bottom:1px solid var(--line)}
.s .lat{font-family:Marcellus,serif;font-size:1.12rem;color:var(--gold);white-space:pre-line;overflow-wrap:anywhere}
.s .tr{color:var(--ink);margin-top:3px}
.s .tr.none{color:var(--mute);font-style:italic}
.s .nt{color:var(--mute);font-size:.88rem;margin-top:2px}
.s .er{white-space:pre-line}
details.s>summary{cursor:pointer;list-style:none}
details.s>summary::-webkit-details-marker{display:none}
details.s[open]>summary{margin-bottom:8px}
.empty{color:var(--mute);padding:20px 0}
footer{padding:36px 0;color:var(--mute);font-size:.92rem;border-top:1px solid var(--line);margin-top:50px}
@media (max-width:560px){.e{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
